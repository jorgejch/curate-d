sonar.projectKey=jorgejch_curate-d
sonar.organization=jorge-haddad-oss

# No sonar.sources or sonar.tests: SonarQube Cloud's analysis scope ignores them, analyses
# the whole repository, and takes test code from pytest's `testpaths` in pyproject.toml.
sonar.python.version=3.12

# Written only by checks.yml's unit-test steps (`--cov-report=xml`). Integration runs pass
# `--no-cov`: SonarQube merges every imported report into one metric, and integration
# coverage deliberately does not count (openspec/config.yaml, §8).
sonar.python.coverage.reportPaths=coverage.xml

# Only src/ counts toward coverage; src/ and infrastructure/ count toward duplication, the
# latter so its hand-written scripts don't copy src/ unseen. tests/ is left out of the
# duplication exclusions, but Sonar measures neither metric on test code, and pytest's
# `testpaths` makes tests/ test code, so its duplication goes unmeasured. Sonar has
# no inclusion form for either, so these list every other top-level path: `*` is the files
# at the root, `<dir>/**` a whole directory. Add a new top-level directory here.
sonar.coverage.exclusions=*,.agents/**,.claude/**,.github/**,docker/**,docs/**,\
  infrastructure/**,migrations/**,openspec/**,tests/**
sonar.cpd.exclusions=*,.agents/**,.claude/**,.github/**,docker/**,docs/**,\
  migrations/**,openspec/**
