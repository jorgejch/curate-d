sonar.projectKey=jorgejch_curate-d
sonar.organization=jorge-haddad-oss

# Explicit, disjoint roots keep unrelated new directories outside analysis. Other paths
# (including migrations, Dockerfiles and workflows) receive no ordinary Sonar findings.
sonar.sources=src,infrastructure
sonar.tests=tests
sonar.python.version=3.12

# Written only by checks.yml's unit-test steps (`--cov-report=xml`). Integration runs pass
# `--no-cov`: SonarQube merges every imported report into one metric, and integration
# coverage deliberately does not count (openspec/config.yaml, §8).
sonar.python.coverage.reportPaths=coverage.xml

# Only src/ counts toward coverage. Both source roots count toward duplication, so
# infrastructure scripts cannot copy src/ unseen. Explicit test code counts toward neither.
sonar.coverage.exclusions=infrastructure/**
