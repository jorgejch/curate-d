sonar.projectKey=jorgejch_curate-d
sonar.organization=jorge-haddad-oss

# Cloud automatic configuration ignores sonar.sources and sonar.tests when enabled.
sonar.scanner.autoconfig.enabled=false

# Explicit, disjoint paths keep unrelated directories and root files outside analysis.
sonar.sources=src,ops,migrations,docker,pyproject.toml,alembic.ini,compose.yaml
sonar.tests=tests
sonar.python.version=3.12

# Text inclusions independently add Git-tracked files to secret scanning: mirror the
# source/test paths, plus docs/** for secret detection only (it stays out of
# sonar.sources), never **/*, which also admits other unselected paths.
sonar.text.inclusions.activate=true
sonar.text.inclusions=src/**/*,docs/**/*,ops/**/*,migrations/**/*,docker/**/*,pyproject.toml,alembic.ini,compose.yaml,tests/**/*,**/*.env*

# Written only by checks.yml's unit-test steps (`--cov-report=xml`). Integration runs pass
# `--no-cov`: SonarQube merges every imported report into one metric, and integration
# coverage deliberately does not count (openspec/config.yaml, §8).
sonar.python.coverage.reportPaths=coverage.xml

# The one analysis filter: docs/diagrams/ holds generated pages (inline JavaScript and CSS)
# that docs/** would otherwise add to secret scanning. Sonar has no text-specific path
# exclusion; check the next scan's indexed files still leave them out.
sonar.exclusions=docs/diagrams/**/*

# Only src/ counts toward coverage. All source roots count toward duplication, so
# operational scripts and migrations cannot copy src/ unseen where supported by their
# language analyzers. Test code counts toward neither metric.
sonar.coverage.exclusions=ops/**/*,migrations/**/*,docker/**/*,pyproject.toml,alembic.ini,compose.yaml
