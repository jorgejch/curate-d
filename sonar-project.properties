sonar.projectKey=jorgejch_curate-d
sonar.organization=jorge-haddad-oss

# No sonar.sources or sonar.tests: SonarQube Cloud's analysis scope ignores them, analyses
# the whole repository, and takes test code from pytest's `testpaths` in pyproject.toml.
sonar.python.version=3.12

# Written only by checks.yml's unit-test steps (`--cov-report=xml`). Integration runs pass
# `--no-cov`: SonarQube merges every imported report into one metric, and integration
# coverage deliberately does not count (openspec/config.yaml, §8).
sonar.python.coverage.reportPaths=coverage.xml
