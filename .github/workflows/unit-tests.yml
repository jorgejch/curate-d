name: Unit Tests

# Every push to any branch runs the unit suite, so a broken branch is visible before it
# becomes a pull request. main, dev and release tags are excluded: docker-publish.yml's
# `check` job already runs this suite on them, with lint, type check and the staging
# integration steps on top. A `branches-ignore` filter alone also leaves tags out.
on:
  push:
    branches-ignore:
      - main
      - dev

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # `testpaths` and the coverage floor come from pyproject.toml: the same run as
      # `make test`, unit tests only.
      - name: Unit tests
        run: uv run pytest -n auto
