name: Integration

# The whole integration suite, against the whole local stack, on every pull request to dev
# or main. The ruleset requires this job, so it is half of the merge gate; checks.yml is the
# other half. Feature-branch pushes never run it: the suite is the slow part, and its PR
# run is the one that counts.
#
# The stack is the one `make stack-up` brings up: PostgreSQL with PostGIS, RustFS with the
# staging provisioning, the rclone daemon, the API and both worker profiles, all from
# compose.yaml with its pinned images, so CI cannot drift from what developers run. The
# application image is built from this commit, which also checks the Dockerfile before
# docker-publish.yml builds from it.
#
# The API and the workers start only after the suite. The suite calls neither, and a worker
# writes the persisted schedules on launch: every launched DBOS process, the suite's
# included, then fires them onto the latest application version, which the suite's schedule
# fixtures make its own. A recovery or refresh tick would then run in the test process,
# against the test rows, whenever the wall clock says so.
on:
  pull_request:
    branches:
      - dev
      - main

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Compose interpolates it for every application service, and the suite encrypts and
  # decrypts provider tokens with it. A public dummy Fernet key: nothing here is real.
  CURATE_D_CREDENTIAL_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

jobs:
  integration:
    # The ruleset requires this check by name: renaming it leaves every pull request
    # waiting on a check that never reports. Pinned by test_integration_workflow.py.
    name: Integration tests
    runs-on: ubuntu-24.04
    # The first full run took about 10 minutes, 9 of them the suite; three times that is
    # room for a slow runner without letting a hung test hold the PR for the 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The suite runs the pull request's code; no step authenticates to the remote.
          persist-credentials: false

      # Rows 30/31 (lifecycle expiry and stale-upload reclamation) need a multi-day
      # observation on a real clock, which no job outlasts. Without a budget they skip,
      # citing the recorded observation; a budget short enough to pass here would record an
      # unobserved reclamation as verified. `make lifecycle-check` re-observes them on a
      # time-scaled RustFS, by hand, on a pin bump.
      - name: Refuse a CI-sized observation budget
        if: env.CURATE_D_TEST_STAGING_LIFECYCLE_TIMEOUT_SECONDS != ''
        run: |
          echo "::error::CURATE_D_TEST_STAGING_LIFECYCLE_TIMEOUT_SECONDS is set in CI."
          echo "Rows 30/31 need a multi-day observation no job outlasts; a budget short"
          echo "enough to pass here would record unobserved reclamation as verified."
          exit 1

      # test_local_ocr.py calls Tesseract from the test process, not from a container.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tesseract-ocr
          tesseract --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once and loaded under the tag compose.yaml names, so `compose up --no-build`
      # starts the API and both workers from it. Same cache as docker-publish.yml.
      - name: Build the application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: curate-d:dev
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only what the suite talks to: the API and the workers wait until it is done (see the
      # header).
      - name: Start PostgreSQL, RustFS and rclone
        run: |
          docker compose up -d --wait --no-build postgres rustfs rclone
          docker compose run --rm rustfs-init

      # Before the API and workers start, so DBOS never launches against a schema Alembic
      # is still changing. The DSN `Settings` defaults to is the published 5433.
      - name: Apply migrations
        run: uv run --locked --no-build alembic upgrade head

      # Serial: the suite shares one database and tests advisory locks across independent
      # connections. RustFS is the only staging backend here; OVH verification stays
      # PENDING, and the report header says so.
      - name: Integration suite
        run: >-
          uv run --locked --no-build pytest tests/integration
          --no-cov -m integration --staging-backend=rustfs
          --junitxml=integration.xml -o junit_family=legacy

      # The image built from this commit must still boot as the API and both workers, on
      # the migrated database. After the suite, so their schedules never tick beside it.
      # `--wait` holds for the API's health check (its /health/ready route); a worker has
      # none, so for a worker it only means the container has not exited.
      - name: Start the application services
        run: docker compose up -d --wait --no-build api worker-io worker-cpu

      # A worker serves no HTTP. It logs `worker.ready` once DBOS has launched, its queues
      # are registered and its schedules applied (curate_d/worker/main.py), so a worker
      # that hangs anywhere in startup never logs it. worker-cpu may restart until
      # worker-io has seeded the staging marker (compose.yaml), hence the wait.
      - name: Wait for the workers to be ready
        run: |
          for service in worker-io worker-cpu; do
            if ! timeout 120 sh -c "until docker compose logs --no-color $service | grep -q '\"event\": \"worker.ready\"'; do sleep 2; done"; then
              echo "::error::$service did not log worker.ready within 120 seconds"
              exit 1
            fi
          done
          # Ready, and still up: a worker that logged ready and then exited is not.
          for service in worker-io worker-cpu; do
            docker compose ps --status running --services | grep -qx "$service" || {
              echo "::error::$service is not running after it logged worker.ready"
              exit 1
            }
          done

      - name: Record staging evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("integration.xml")
          lines = ["### Integration suite", "", "OVH verification remains PENDING.", ""]
          if not report.exists():
              lines.append("The suite did not produce a result; nothing was verified.")
          else:
              cases = ElementTree.parse(report).findall(".//testcase")

              def counts(prefix: str) -> str:
                  # Counted per module, so the contract evidence is never mistaken for
                  # the suite's total.
                  mine = [c for c in cases if c.get("classname", "").startswith(prefix)]
                  failed = sum(1 for c in mine if c.find("failure") is not None)
                  errored = sum(1 for c in mine if c.find("error") is not None)
                  skipped = sum(1 for c in mine if c.find("skipped") is not None)
                  return (
                      f"Tests: {len(mine)}; failures: {failed}; errors: {errored}; "
                      f"skipped: {skipped}."
                  )

              lines += ["Whole suite: " + counts("tests.integration."), ""]
              lines += ["#### RustFS staging contract", "", counts("tests.integration.test_staging_contract"), ""]
              for prop in ElementTree.parse(report).findall(".//property[@name='sdk_checksum_headers']"):
                  lines += ["Safe SDK checksum headers:", "```json", prop.get("value", ""), "```", ""]
              lines += [
                  "#### RustFS backend provisioning checks",
                  "",
                  counts("tests.integration.test_staging_backend_checks"),
                  "",
                  "Rows 30 and 31 skip here, citing the recorded time-scaled observation "
                  "(infrastructure/staging-compatibility.md); `make lifecycle-check` "
                  "re-observes them on a RustFS pin bump. On OVH they were observed "
                  "separately.",
              ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Remove the stack
        if: always()
        run: docker compose down --volumes
