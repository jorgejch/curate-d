name: Unit Tests and SonarQube

# Runs the unit suite and uploads its coverage to SonarQube Cloud.
#
#   pull request to dev or main -> PR analysis; the unit step's 80% floor gates the PR
#   push to dev or main         -> branch analysis of the long-lived branches
#   push to any other branch    -> branch analysis, so a branch is visible before its PR
#
# main is analysed although dev is the default branch today: main becomes the default
# later, and SonarQube's main-branch view and badge follow it. A `branches` filter alone
# leaves tags out; a release tag's commit is already analysed as main.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened]

# A newer push to the same branch, or to the same PR, supersedes the run in progress.
concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # The ruleset on dev and main requires this check by name: renaming it leaves the rule
    # waiting on a check that never reports.
    name: Unit tests and SonarQube analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: SonarQube tells new code from old by SCM blame.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # `testpaths` and the 80% floor come from pyproject.toml: the same run as `make
      # test`, unit tests only, so this step is the coverage gate. The XML report is for
      # SonarQube alone, which merges every report it imports into one metric.
      - name: Unit tests
        run: uv run pytest -n auto --cov-report=xml

      - name: Cache SonarQube packages
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Also runs when the unit step failed on the floor, so the analysis shows the
      # coverage that failed it; the job stays red either way. A fork's pull request has
      # no SONAR_TOKEN, a secret its author cannot supply. Every other run is scanned, so
      # a missing token fails the job instead of skipping the analysis.
      - name: SonarQube scan
        if: >-
          ${{ !cancelled() && hashFiles('coverage.xml') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
