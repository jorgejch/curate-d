name: SonarQube

# Runs the unit suite and uploads its coverage to SonarQube Cloud on every branch push
# (feature branches, dev and main) and on every pull request to dev or main. The unit
# step's 80% floor comes from pyproject.toml, and the ruleset requires this job's check, so
# the floor gates pull requests. The integration suite does not run here:
# docker-publish.yml's `check` job runs it on pull requests, never on feature pushes.
# A `branches` filter alone leaves tags out.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened]

# A newer push to the same branch, or to the same PR, supersedes the run in progress.
concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # The ruleset requires this check by name: renaming it leaves the rule waiting on a
    # check that never reports. Pinned by test_sonarqube_workflow.py.
    name: Unit tests and SonarQube analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: SonarQube tells new code from old by SCM blame.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # `--no-build`: dependencies install from the lockfile's wheels, never by running a
      # source distribution's build scripts.
      - name: Install dependencies
        run: uv sync --locked --no-build

      # The same run as `make test`: unit tests only, with the 80% floor. The XML report
      # is for SonarQube alone.
      - name: Unit tests
        run: uv run --locked --no-build pytest -n auto --cov-report=xml

      - name: Cache SonarQube packages
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Also runs when the unit step failed on the floor, so the analysis shows the
      # coverage that failed it; the job stays red either way. A fork's pull request has
      # no SONAR_TOKEN, a secret its author cannot supply. Every other run is scanned, so
      # a missing token fails the job instead of skipping the analysis.
      - name: SonarQube scan
        if: >-
          ${{ !cancelled() && hashFiles('coverage.xml') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
