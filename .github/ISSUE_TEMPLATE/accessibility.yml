name: Accessibility barrier
description: Something in curate.d's API, CLI output or documentation you can't use with your setup.
labels: [accessibility]
body:
  - type: textarea
    id: barrier
    attributes:
      label: The barrier
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: A file, page, endpoint or command.
      placeholder: docs/diagrams/architecture/curate-d-architecture.html
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Assistive technology, browser or terminal, operating system, and any settings that matter (zoom, contrast, reduced motion). Share only what you're comfortable with.
  - type: textarea
    id: suggestion
    attributes:
      label: What would work for you
